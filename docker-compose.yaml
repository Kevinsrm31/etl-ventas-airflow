name: ${COMPOSE_PROJECT_NAME:-datapath-lab-ventas}

x-airflow-common: &airflow-common
  image: datapath-lab-ventas:3.3.2-python3.12
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Ejecuta preparar_entorno.py primero}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Ejecuta preparar_entorno.py primero}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SCHEDULER__MIN_SERIALIZED_DAG_UPDATE_INTERVAL: "10"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "10"
    AIRFLOW_CONN_POSTGRES_DATAPATH: '{"conn_type":"postgres","host":"datapath-db","login":"dp_user_pg","password":"dp_pass_pg","schema":"datapath_pg","port":5432}'
    VENTAS_CARPETA_ENTRADA: /opt/airflow/data/entrada
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./data:/opt/airflow/data:ro
    - ./tests:/opt/airflow/tests:ro
    - ./pytest.ini:/opt/airflow/pytest.ini:ro
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config:ro
    - ./plugins:/opt/airflow/plugins:ro
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    datapath-db:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Base donde el DAG deja las ventas (la del ETL, no la de Airflow)
  datapath-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dp_user_pg
      POSTGRES_PASSWORD: dp_pass_pg
      POSTGRES_DB: datapath_pg
    volumes:
      - datapath-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dp_user_pg -d datapath_pg"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        exec /entrypoint airflow version
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  airflow-db:
  datapath-db:
